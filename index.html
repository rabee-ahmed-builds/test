<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swachh Nova – Clean Ganga Ghats Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg:#EAF2F1;--card:#fff;--ink:#10242B;--mute:#5B7178;--river:#0E4D64;--gold:#F2A900;--red:#C8452D;--blue:#2F7FBF;--green:#2E8B57;--line:#CFE0DE;--onriver:#fff;--nav:var(--card);--hdr:var(--river);--hdrink:var(--onriver);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1720;--card:#102A33;--ink:#EAF4F7;--mute:#8FB0BB;--river:#56B8D0;--line:#21404B;--onriver:#06202A;--nav:#183B45;--hdr:#102A33;--hdrink:#EAF4F7;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--hdr);color:var(--hdrink);padding:14px 16px 12px;border-bottom:1px solid transparent}
header h1{margin:0;font-size:26px;font-weight:800}header p{margin:0;font-size:13px;opacity:.92}
.who{font-size:12px;margin-top:6px}.who a{text-decoration:underline;cursor:pointer}
.role{display:none;gap:6px;margin-top:8px}
.role button{flex:1;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:20px;padding:5px;font:600 14px Mukta,sans-serif;cursor:pointer}
.role button.on{background:var(--gold);border-color:var(--gold);color:#10242B}
main{padding:14px 14px 90px;max-width:680px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
label.l{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
select,textarea,input[type=text],input[type=password],input[type=email],input[type=number]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px Mukta,sans-serif}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;font:700 14px Mukta,sans-serif;background:var(--river);color:var(--onriver);cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:var(--gold);color:#10242B}.btn.full{width:100%;margin-top:12px;padding:12px;font-size:15px}.btn.red{background:var(--red);color:#fff}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fi{margin-top:8px;font-size:13px;font-weight:600}.fi span{display:block;margin-bottom:3px}
input.file{width:100%;font:14px Mukta,sans-serif;color:var(--ink)}
input.file::file-selector-button{border:0;border-radius:8px;padding:9px 14px;margin-right:10px;background:var(--gold);color:#10242B;font:700 14px Mukta,sans-serif;cursor:pointer}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:10px}
.gps,.note{font-size:13px;color:var(--mute)}.note{font-size:12px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.s-Reported{background:var(--red)}.s-Assigned{background:var(--blue)}.s-Cleaned{background:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.steps{display:flex;margin:10px 0 4px;font-size:12px;color:var(--mute)}
.steps span{flex:1;text-align:center;border-top:4px solid var(--line);padding-top:3px}
.steps span.done{border-color:var(--green);color:var(--ink);font-weight:600}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ba figure{margin:0;font-size:12px;color:var(--mute)}.ba img,.ph{width:100%;height:110px;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font:600 13px Mukta,sans-serif;cursor:pointer}
.chips button.on{background:var(--river);color:var(--onriver);border-color:var(--river)}
nav{position:sticky;top:0;z-index:6;background:var(--nav);border-bottom:1px solid var(--line);display:none}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px;font:600 11px Mukta,sans-serif;cursor:pointer}
nav button.on{color:var(--river);box-shadow:inset 0 -3px 0 var(--gold)}nav b{display:block;font-size:19px}
.prev{max-width:100%;max-height:200px;border-radius:10px;margin-top:6px}.s-Pending{background:#8a6d00}.s-Review{background:#7a3fa0}
.sl{aspect-ratio:4/3;min-height:240px;max-height:560px;border-radius:12px;overflow:hidden;position:relative;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center}.sl img{width:100%;height:100%;object-fit:cover}.sl .cp{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;padding:6px 10px;font-size:13px}.sl .tx{padding:14px;font-weight:700}
#lbx{display:none;position:fixed;inset:0;background:#000d;z-index:30;align-items:center;justify-content:center}#lbx img{max-width:96%;max-height:92%}img[onclick]{cursor:zoom-in}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 6px}.bar i{display:block;height:100%;background:var(--red)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mute);padding:20px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tot b{display:block;font-size:26px}
.lb{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}.lb .nm{flex:1}.lb.me{font-weight:800}
.ic{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 10px;font:600 13px Mukta,sans-serif;cursor:pointer}
.tag{background:var(--gold);color:#10242B;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
.feed{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed i{font-style:normal;font-size:20px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.quote{background:var(--river);color:var(--onriver);border:0}.quote p{font-size:19px;font-weight:600;margin:6px 0 0}.quote .note{color:inherit;opacity:.85}

html[data-theme=light]{--bg:#EAF2F1;--card:#fff;--ink:#10242B;--mute:#5B7178;--river:#0E4D64;--line:#CFE0DE;--onriver:#fff;--nav:var(--card);--hdr:var(--river);--hdrink:var(--onriver);color-scheme:light}
html[data-theme=dark]{--bg:#0B1720;--card:#102A33;--ink:#EAF4F7;--mute:#8FB0BB;--river:#56B8D0;--line:#21404B;--onriver:#06202A;--nav:#183B45;--hdr:#102A33;--hdrink:#EAF4F7;color-scheme:dark}
#bgl,#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}#bgl{background-color:var(--bg)}
.fp{position:absolute;top:0;line-height:1;opacity:.85;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0)}to{transform:translate3d(var(--dx,40px),110vh,0) rotate(360deg)}}
@keyframes rise{from{transform:translate3d(0,110vh,0)}to{transform:translate3d(var(--dx,30px),-15vh,0)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font:inherit}
.tile .ti{font-size:28px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;flex:none}
.tile .tt{flex:1;min-width:0}.tile .tt b{display:block;font-size:17px}.tile .tt small{display:block;color:var(--mute);font-size:13px}
.tile .tc{font-size:26px;color:var(--mute)}.tile.back{justify-content:center;font-weight:700;color:var(--river)}

/* Settings: two tiles per row */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sgrid .tile{flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;gap:8px;margin-bottom:0;padding:16px 10px;height:100%}
.sgrid .tile .ti{background:transparent;width:auto;height:auto;font-size:30px}
.sgrid .tile .tt{flex:none;width:100%}
.sgrid .tile .tt b{font-size:16px}
.sgrid .tile .tt small{margin-top:3px;line-height:1.35}
.sgrid .tile .tc{display:none}
@media(max-width:380px){.sgrid .tile{padding:14px 6px}.sgrid .tile .tt b{font-size:15px}.sgrid .tile .tt small{font-size:12px}}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.opts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font:600 13px Mukta,sans-serif;cursor:pointer}.opts button.on{background:var(--river);color:var(--onriver);border-color:var(--river)}
.sw{width:76px;height:52px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0;font:700 11px Mukta,sans-serif;color:#fff;text-shadow:0 1px 3px #000}.sw.on{outline:3px solid var(--gold)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.tg small{display:block;color:var(--mute);font-size:12px}.tg input{width:22px;height:22px;flex:none}
.hero{display:flex;gap:14px;align-items:center}.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--river),var(--gold));color:#fff;font:800 24px Mukta,sans-serif;display:flex;align-items:center;justify-content:center;flex:none}
.wb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lb{flex-wrap:wrap}.lb .wb{flex:1 0 100%;margin-top:2px}.lb .nm{min-width:0;overflow-wrap:anywhere}
.uin{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.uin input{flex:1 1 96px;min-width:0}
.card{overflow-wrap:anywhere}main{max-width:var(--mw,680px);overflow-x:hidden}
nav{transition:transform .25s;overflow-x:auto}nav.nh{transform:translateY(-110%)}
@keyframes pslide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}@keyframes pfade{from{opacity:0}to{opacity:1}}@keyframes pzoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
html[data-pe=slide] #app.pe{animation:pslide .25s}html[data-pe=fade] #app.pe{animation:pfade .25s}html[data-pe=zoom] #app.pe{animation:pzoom .25s}
html.t2 body{zoom:1.14}html.t3 body{zoom:1.3}
html.fr body{letter-spacing:.03em;word-spacing:.12em;line-height:1.75}html.fs *{font-family:Georgia,'Times New Roman',serif!important}
html.d1 .card{padding:9px;margin-bottom:8px}html.d3 .card{padding:20px;margin-bottom:18px}
html.sq .card,html.sq .btn,html.sq .ic,html.sq .sl,html.sq select,html.sq input,html.sq textarea,html.sq .tile{border-radius:3px}
html.rm *{animation:none!important;transition:none!important}
html.hc{--line:#000;--mute:#222}html.hc.dk{--line:#fff;--mute:#ddd}html.hc .card{border-width:2px}
html.ul a{text-decoration:underline!important;font-weight:700}
html.cl .card,html.cl .tile{box-shadow:0 8px 22px rgba(0,0,0,.18);border-color:transparent}
html.co .card,html.co .tile{background:transparent;border:2px solid var(--river)}
html.big .btn,html.big .ic,html.big nav button,html.big select,html.big input,html.big .opts button{min-height:48px}
html.cb{--red:#D55E00;--green:#0072B2;--blue:#CC79A7}
html.cs .card,html.cs .tile{background:color-mix(in srgb,var(--card) 86%,transparent)}
html.cg .card,html.cg .tile{background:color-mix(in srgb,var(--card) 60%,transparent);backdrop-filter:blur(8px)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.av.big{width:96px;height:96px;font-size:40px;margin:0 auto 10px}
.wb.one{flex-wrap:nowrap;gap:5px}.wb.one>button{flex:1 1 0;min-width:0;padding:8px 2px;font-size:13px;white-space:nowrap;text-align:center}
.lb:not(:has(.wb)){flex-wrap:nowrap}.lb>button{flex:0 0 auto;white-space:nowrap}
.pa span,.avb span{display:block;line-height:1}.av.pa{font-size:26px}.av.big.pa{font-size:46px}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 10px}.avb{aspect-ratio:1;border:2px solid var(--line);border-radius:50%;font-size:24px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
@keyframes avb0{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}@keyframes avb1{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes avb2{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}@keyframes avb3{0%,100%{transform:translateX(-9%)}50%{transform:translateX(9%)}}
.a0{animation:avb0 1.6s ease-in-out infinite}.a1{animation:avb1 1.4s ease-in-out infinite}.a2{animation:avb2 1.8s ease-in-out infinite}.a3{animation:avb3 1.7s ease-in-out infinite}
html.rm .a0,html.rm .a1,html.rm .a2,html.rm .a3{animation:none!important}@media(prefers-reduced-motion:reduce){.a0,.a1,.a2,.a3{animation:none!important}}
.avg.ad{grid-template-columns:repeat(4,1fr)}.avc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.avc.off{opacity:.45}.avc .av{width:100%;height:auto;aspect-ratio:1;font-size:26px}.avc .ic{width:100%;padding:3px 0;text-align:center}
#sky{position:absolute;inset:0;perspective:800px;perspective-origin:50% 55%;overflow:hidden}
#sky .sc{position:absolute;inset:-6%;transform-style:preserve-3d;transform:rotateY(calc(var(--px,0)*5deg)) rotateX(calc(var(--py,0)*-3deg));transition:transform .3s ease-out}
.sc.d{--a:#3fb0ff;--b:#bfe8ff;--c:#fff2cc;--h1:#6a9a78;--h2:#3f6b52;--w1:#3d9fd0;--w2:#b9e6f6}
.sc.g{--a:#4a5fa8;--b:#f59a6b;--c:#ffd27a;--h1:#7a5a6e;--h2:#3e3552;--w1:#c9774f;--w2:#ffd49a}
.sc.n{--a:#050b1f;--b:#101d45;--c:#26356b;--h1:#16244a;--h2:#0b1328;--w1:#07132b;--w2:#1b3a6b}
#sky .ly{position:absolute;inset:0}
.sk0{background:linear-gradient(180deg,var(--a),var(--b) 55%,var(--c));transform:translateZ(-400px) scale(1.5)}
.su,.mo{left:auto;right:14%;top:9%;bottom:auto;width:84px;height:84px;border-radius:50%;transform:translateZ(-300px) scale(1.375)}
.su{background:radial-gradient(circle,#fff8c9 30%,#ffd54a 60%,rgba(255,213,74,0) 72%);box-shadow:0 0 90px 40px rgba(255,214,90,.45)}
.sc.g .su{top:36%;background:radial-gradient(circle,#fff0c0 30%,#ff9a3c 62%,rgba(255,154,60,0) 72%);box-shadow:0 0 90px 45px rgba(255,140,60,.45)}
.mo{background:radial-gradient(circle at 35% 35%,#fff,#eef2ff 40%,#c5cde8 70%);box-shadow:0 0 70px 24px rgba(190,205,255,.35)}
.stl{transform:translateZ(-320px) scale(1.4)}.st{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.cls{transform:translateZ(-200px) scale(1.25)}.cl{position:absolute;left:-30%;width:130px;height:38px;background:#fff;border-radius:40px;opacity:.88;box-shadow:34px -14px 0 4px #fff,-26px 4px 0 -4px #fff;animation:cd 80s linear infinite}
.sc.g .cl{background:#ffd9c0;box-shadow:34px -14px 0 4px #ffd9c0,-26px 4px 0 -4px #ffd9c0}
@keyframes cd{to{left:130%}}
#sky .hl{inset:auto 0 26%;height:30%;background:linear-gradient(var(--h1),var(--h2));clip-path:polygon(0 60%,10% 35%,22% 55%,36% 20%,50% 50%,64% 25%,78% 52%,90% 30%,100% 55%,100% 100%,0 100%);transform:translateZ(-120px) scale(1.15)}
#sky .gh{inset:auto 45% 20% -4%;height:16%;transform:translateZ(-40px) scale(1.05)}
.gh span{display:block;height:30%;margin-top:3%;background:linear-gradient(#d2ac7c,#8d6b45);border-radius:2px}
.sc.n .gh{filter:brightness(.35)}.sc.g .gh{filter:brightness(.75)}
#sky .rv{inset:auto -30% -8% -30%;height:78%;background:linear-gradient(180deg,var(--w2),var(--w1));transform-origin:50% 100%;transform:rotateX(66deg);overflow:hidden}
.rv::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,transparent 3px 28px);animation:rw 7s linear infinite}
@keyframes rw{to{background-position:0 56px}}
.dy{position:absolute;width:12px;height:18px;border-radius:50%;background:radial-gradient(#ffe08a,#ff8a00);box-shadow:0 0 14px 6px rgba(255,160,40,.6);animation:df 7s ease-in-out infinite}
@keyframes df{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
html.rm #sky *{animation:none!important}html.rm #sky .sc{transition:none;transform:none}
html.nt #app>.note,html.nt #app>p{color:#dbe7ff}

.sl{aspect-ratio:auto;height:62vw;min-height:300px;max-height:520px}.sl .tx{font-size:24px;padding:22px;line-height:1.35}.sl .cp{font-size:15px;padding:10px 14px}
#bgl.bga{animation:bgshift 20s ease-in-out infinite alternate}@keyframes bgshift{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes sail{from{transform:translate3d(-20vw,0,0)}to{transform:translate3d(120vw,0,0)}}@keyframes ff{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(18px,-22px)}}

.ssw{position:relative;flex:1 1 160px;min-width:0;width:100%}.ssb{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font:600 15px Mukta,sans-serif;cursor:pointer}
.ssp{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.28);padding:8px}.ssp input{width:100%;margin:0 0 6px}
.ssl{max-height:240px;overflow:auto}.sso{padding:10px;border-radius:6px;cursor:pointer;color:var(--ink)}.sso:hover,.sso.on{background:var(--river);color:var(--onriver)}
html.cs .card,html.cs .tile{background:color-mix(in srgb,var(--card) 94%,transparent)}html.cg .card,html.cg .tile{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(10px)}
html.cs .quote,html.cg .quote{background:color-mix(in srgb,var(--river) 92%,transparent);color:var(--onriver)}.quote p,.quote .note{text-shadow:none}
.ic{-webkit-appearance:none;appearance:none;background:var(--card);color:var(--ink)}.ic:disabled{color:var(--ink)}

nav,html.cs nav,html.cg nav{background:var(--nav)!important}
header{text-align:center}.hrow{display:flex;align-items:center;justify-content:center;gap:10px}.hrow h1{margin:0;min-width:0;overflow-wrap:anywhere}.hic{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:center;font-size:30px;flex:0 0 42px}.hic:empty{display:none}#htag{text-align:center;margin:6px 0 8px;font-weight:600}
.i-sweep{display:inline-block;transform-origin:80% 10%;animation:swp 1.3s ease-in-out infinite alternate}.i-spin{display:inline-block;animation:spn 6s linear infinite}.i-bob{display:inline-block;animation:bobb 2.2s ease-in-out infinite}.i-flick{display:inline-block;animation:flk 1.4s ease-in-out infinite}
.swp{transform-origin:45px 9px;animation:swp 1.3s ease-in-out infinite alternate}.dst{animation:dstm 1.3s ease-in-out infinite alternate}.dst.d2{animation-delay:.4s}
@keyframes swp{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}@keyframes spn{to{transform:rotate(360deg)}}@keyframes bobb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes flk{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.8}}@keyframes dstm{from{opacity:.1;transform:translateX(0)}to{opacity:1;transform:translateX(5px)}}

@media (prefers-color-scheme:dark){html:not([data-theme=light]) header{border-bottom-color:var(--line)}}html[data-theme=dark] header{border-bottom-color:var(--line)}
body,header,nav,.card,.tile,.btn,input,select,textarea,.ssb,.ssp{transition:background-color .25s ease,color .25s ease,border-color .25s ease}nav{transition:transform .25s,background-color .25s ease,color .25s ease}

let lastDrawTab=null;
function draw(){
 const ap=$('app'),y=window.scrollY,hh=ap?ap.offsetHeight:0,same=lastDrawTab===tab,ae=document.activeElement,aid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd;
 if(ap&&same&&hh)ap.style.minHeight=hh+'px';
 draw0();
 lastDrawTab=tab;
 if(aid&&ap){const e=document.getElementById(aid);if(e&&e!==document.activeElement&&e.focus){try{e.focus({preventScroll:true});if(ss!=null&&e.setSelectionRange)e.setSelectionRange(ss,se)}catch(_){}}}
 if(same)window.scrollTo(0,y);
 if(ap)requestAnimationFrame(()=>{ap.style.minHeight='';if(same&&Math.abs(window.scrollY-y)>2)window.scrollTo(0,y)});
}

function card(r){
 const vol=isVol(),mem=isMem(),own=r.repUid===U.uid,cl=r.byUid===U.uid,pend=r.st==='Pending'||r.st==='Review',lockB=r.st==='Assigned'||r.st==='Cleaned',lockA=!!r.done,V=Array.isArray(r.vols)?r.vols:[],need=r.volsNeeded||1,inT=!!U&&(r.byUid===U.uid||V.some(v=>v.uid===U.uid));let a=`<a class="btn" href="${navUrl(r)}" target="_blank" rel="noopener">🧭 Navigate in Google Maps</a>`,x='';
 if(!pend&&vol&&r.st==='Reported')a+=`<button class="btn alt" onclick="takeTask('${r.id}')">Accept task</button>`;
 if(r.st==='Assigned'&&inT&&!r.done)a+=`<button class="ic" onclick="needHelp('${r.id}')">🙋 Need more help</button><button class="ic" onclick="declineTask('${r.id}')">↩️ Decline task</button>`;
 if(r.st==='Assigned'&&vol&&!inT&&!r.done){if(V.length<need)a+=`<button class="btn alt" onclick="joinTask('${r.id}')">🤝 Join this task</button>`;else x+='<p class="note">Team full. All needed volunteers have joined.</p>'}
 if(pend&&mem)a+=`<button class="btn" onclick="review('${r.id}',true)">✅ Approve</button><button class="btn red" onclick="review('${r.id}',false)">❌ Decline</button>`;
 if(pend&&!mem)x+=`<p class="note">${r.st==='Review'?'An admin is reviewing this report.':'Waiting for a member to approve. Then everyone can see it.'}</p>`;
 if(r.photo&&(own||isAdm())&&!lockB)a+=`<button class="ic" onclick="rmPhoto('${r.id}','photo')">${own?'🗑 Remove photo (cancels my report)':'🗑 Remove photo (user must add a new one)'}</button>`;
 if(r.after&&(cl||isAdm())&&!lockA)a+=`<button class="ic" onclick="rmPhoto('${r.id}','after')">🗑 Remove after photo</button>`;
 if(!r.photo)x+=fileIn('before',r.id,'Add before photo');
 else if((own||isAdm())&&!lockB)x+=fileIn('replace',r.id,'Edit: replace before photo');
 if(r.after&&(cl||isAdm())&&!lockA)x+=fileIn('replacea',r.id,'Edit: replace after photo');
 if(!pend&&vol&&r.st==='Assigned'&&inT)x+=fileIn('after',r.id,'Upload after photo (marks the task as cleaned)');
 if(!pend&&!vol&&r.st!=='Cleaned')x+='<p class="note">Switch to Volunteer (top) to accept or clean this task.</p>';
 const L=['Reported','Assigned','Cleaned'],i=L.indexOf(r.st);
 return `<div class="card"><div class="row"><b>${esc(gh(r.g).n)}${r.bld&&bName(r.bld)?' · '+esc(bName(r.bld)):''}</b><span class="badge s-${r.st}">${r.st==='Review'?'Admin review':r.st}</span></div>
 <div class="gps">${esc(r.note)} · ${ago(r.t)} · by ${esc(r.repName)}${r.byName?' · cleaner: '+esc(V.length>1?V.map(v=>v.name).join(', '):r.byName):''}</div>${(r.st==='Assigned'||(r.st==='Reported'&&need>1))?`<div class="gps">👥 Volunteers: ${V.length} joined / ${need} needed${V.length?' · '+esc(V.map(v=>v.name).join(', ')):''}</div>`:''}${r.landmark?`<div class="gps">📌 Landmark: ${esc(r.landmark)}</div>`:''}
 <div class="steps">${L.map((s,k)=>`<span class="${k<=i?'done':''}">${s}</span>`).join('')}</div>
 <div class="ba"><figure>${r.photo?`<img src="${r.photo}" alt="Before" onclick="openImg(this.src)">`:'<div class="ph"></div>'}Before</figure><figure>${r.after?`<img src="${r.after}" alt="After" onclick="openImg(this.src)">`:'<div class="ph"></div>'}After</figure></div>
 <div class="acts">${a}</div>${x}</div>`}
function onPhoto(t){

 if(!f)return;toast('Processing photo...');
 readPhoto(f,async u=>{try{

  else if(kind==='replace'||kind==='replacea'){const w=kind==='replace'?'photo':'after';if(r){r[w==='photo'?'photo':'after']=u;draw()}toast('Uploading...');const url=await upPhoto(u);await rpcT('replace_photo',{p_id:id,p_which:w,p_url:url});if(r)r[w==='photo'?'photo':'after']=url;draw();toast('Photo updated')}
  else if(kind==='after'){r.after=u;draw();toast('Uploading...');const url=await upPhoto(u);await T().update({st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});Object.assign(r,{st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});draw();

 }catch(e){toast(errMsg(e));sd()}})}

/* profile */
function vProfile(){const pend=ME.pendingAccess==='member';
 return `<div class="card"><h2>My profile</h2><label class="l" for="pn">Name</label><input type="text" id="pn" maxlength="30" value="${esc(ME.name)}"><label class="l">Email</label><p style="margin:4px 0">${esc(U.email||'')}</p><label class="l" for="pp">Phone (optional)</label><input type="text" id="pp" maxlength="15" inputmode="tel" value="${esc(phoneOf(U.uid))}"><div class="acts"><button class="btn" onclick="saveProfile()">Save</button><button class="btn red" onclick="logout()">Log out</button></div><p class="note">${ME.pts} points${ME.blocked?' · your account is blocked':''}</p></div>
 <div class="card"><h2>Member section</h2>${isMem()?`<p class="note" style="margin-top:0">You are a member.</p><button class="btn full" onclick="go('team')">Open member page${pendN()?' ('+pendN()+' waiting)':''}</button>`
 :pend?'<p class="note" style="margin-top:0">Your request is waiting for an admin to approve.</p>'
 :`<label class="l" for="mpw">Member password</label><input type="password" id="mpw" maxlength="30" autocomplete="off"><button class="btn full" onclick="reqAccess('member')">Send request</button>`}</div>
 <div class="card"><h2>Admin section</h2>${isAdm()?`<button class="btn full" onclick="go('admin')">Open admin page</button>`
 :`<label class="l" for="ae">Email</label><input type="email" id="ae" value="${esc(U.email||'')}"><label class="l" for="ap">Phone</label><input type="text" id="ap" maxlength="15" inputmode="tel" value="${esc(phoneOf(U.uid))}"><label class="l" for="apw">Admin password</label><input type="password" id="apw" maxlength="30" autocomplete="off"><button class="btn full" onclick="reqAccess('admin')">Open admin section</button>`}</div>${vGuide()}${vContact()}`}
async function saveProfile(){const n=$('pn').value.trim(),ph=$('pp').value.trim();if(!n){toast('Name cannot be empty');return}if(!/^[0-9+ ]{0,15}$/.test(ph)){toast('Phone must be digits only');return}try{await db.collection('users').doc(U.uid).update({name:n.slice(0,30)});await db.collection('user_private').doc(U.uid).update({phone:ph});toast('Saved')}catch(e){toast(errMsg(e))}}
async function reqAccess(k){try{if(k==='member')await rpcT('request_access',{p_kind:'member',p_code:$('mpw').value,p_phone:'',p_email:''});else await rpcT('request_access',{p_kind:'admin',p_code:$('apw').value,p_phone:$('ap').value.trim(),p_email:$('ae').value.trim()});toast(k==='admin'?'Admin section unlocked':'Request sent to the admins');if(k==='admin')go('admin')}catch(e){toast(errMsg(e))}}
/* admin page */
const up=async u=>u&&String(u).startsWith('data:')?await upPhoto(u):u||null;
function vAdmin(){if(!isAdm())return vProfile();
 const req=users.filter(u=>u.pendingAccess==='member'),mems=users.filter(u=>u.access==='member');
 return `<div class="card"><div class="acts" style="margin-top:0"><button class="ic" onclick="go('profile')">← Back to settings</button><button class="ic" onclick="go('team')">Member page</button></div></div>
 <div class="card"><h2>Member requests</h2>${req.length?req.map(u=>`<div class="lb"><span class="nm">${esc(u.name)}</span><button class="btn" onclick="apMem('${u.id}',true)">Approve</button><button class="ic" onclick="apMem('${u.id}',false)">Decline</button></div>`).join(''):'<p class="note">No requests.</p>'}${mems.length?`<h2 style="margin-top:14px">Members</h2>`+mems.map(u=>`<div class="lb"><span class="nm">${esc(u.name)}</span><button class="ic" onclick="rmMem('${u.id}')">Remove</button></div>`).join(''):''}</div>
 <div class="card"><h2>Users</h2>${users.map(u=>{const lock=u.access==='admin'&&u.id!==U.uid;return `<div class="lb"><span class="note" style="width:52px">${u.access}${u.blocked?' · blocked':''}</span>${lock?`<span class="nm">${esc(u.name)}</span>`:`<input type="text" id="ea-${u.id}" value="${esc(u.name)}" maxlength="30" style="width:110px"><input type="text" id="ep-${u.id}" value="${esc(phoneOf(u.id))}" maxlength="15" placeholder="phone" style="width:100px"><input type="number" id="ept-${u.id}" value="${u.pts}" min="0" style="width:70px"><button class="btn" onclick="editU('${u.id}')">Save</button>`}${u.access==='admin'?'':`${blkBtns(u)}`}</div>`}).join('')}</div>
 <div class="card"><h2>Passwords</h2><p class="note" style="margin-top:0">Leave a box empty to keep the old password.</p><label class="l" for="mc">New member password</label><input type="text" id="mc" maxlength="30"><label class="l" for="ac2">New admin password</label><input type="text" id="ac2" maxlength="30"><button class="btn full" onclick="setCodes()">Save passwords</button></div>
 ${vSponsorAdmin()}
 <div class="card"><button class="btn red full" onclick="doReset()">Reset all reports, points, notices, ads and sponsors</button></div>`}
async function apMem(id,ok){try{await rpcT('approve_member',{p_id:id,p_ok:ok});toast(ok?'Member added':'Declined')}catch(e){toast(errMsg(e))}}
async function rmMem(id){try{await rpcT('admin_remove_member',{p_id:id});toast('Member removed')}catch(e){toast(errMsg(e))}}
async function editU(id){try{await rpcT('admin_edit_user',{p_id:id,p_name:$('ea-'+id).value,p_phone:$('ep-'+id).value.trim(),p_pts:parseInt($('ept-'+id).value,10)||0});toast('Saved')}catch(e){toast(errMsg(e))}}
async function setCodes(){try{await rpcT('admin_set_codes',{p_member:$('mc').value.trim(),p_admin:$('ac2').value.trim()});$('mc').value='';$('ac2').value='';toast('Passwords saved')}catch(e){toast(errMsg(e))}}
async function saveSlide(){if(nsl.k==='ad'&&!nsl.a.trim()){toast('Enter the company name');return}if(nsl.k==='notice'&&!nsl.a.trim()&&!nsl.img){toast('Type a notice or add a photo');return}
 try{toast('Uploading...');const img=await up(nsl.img);if(nsl.k==='ad')await rpcT('adm_save_ad',{p_id:null,p_name:nsl.a.trim(),p_img:img,p_link:nsl.l.trim()});else await rpcT('adm_save_notice',{p_text:nsl.a.trim(),p_img:img});nsl={k:nsl.k,a:'',l:'',img:null};toast('Added to the slider');draw()}catch(e){toast(errMsg(e))}}
async function delSlide(k,id){try{await rpcT(k==='ad'?'adm_del_ad':'adm_del_notice',{p_id:id});toast('Deleted')}catch(e){toast(errMsg(e))}}
async function approveSponsor(id){try{const x=sponsors.find(s=>s.id===id);await rpcT('admin_approve_sponsor',{p_id:id});await log('sponsor',x.name+' became a '+tier(x.tier)[1]+' sponsor');toast('Sponsor approved')}catch(e){toast(errMsg(e))}}
async function delSponsor(id){try{await rpcT('admin_delete_sponsor',{p_id:id});toast('Removed')}catch(e){toast(errMsg(e))}}
async function doReset(){if(!confirm('Reset all reports, points, notices, ads and sponsors for everyone?'))return;try{await rpcT('admin_reset');await log('admin','Admin reset the app. All reports and points are cleared.');eff='user';sb.rpc('lock_access').then(()=>{});tab='profile';toast('Everything was reset')}catch(e){toast(errMsg(e))}}

/* ---------- location, notices/slides, motivation, photo removal ---------- */
function vAddLoc(){return `<div class="card"><div class="row"><h2 style="margin:0">Add location</h2><span class="note">Member only</span></div><p class="note" style="margin-top:6px">Add a ghat or spot near NIT Patna. It shows in the map above and in the report form.</p>${ld.open&&isMem()?`<label class="l" for="ln">Name</label><input type="text" id="ln" maxlength="40" value="${esc(ld.n)}" oninput="ld.n=this.value"><label class="l" for="lq">Place name or coordinates (optional)</label><input type="text" id="lq" maxlength="100" placeholder="Example: 25.6205, 85.1730" value="${esc(ld.q)}" oninput="ld.q=this.value"><div class="acts"><button class="btn" onclick="addLoc()">Add</button><button class="ic" onclick="ld.open=false;draw()">Cancel</button></div>`:`<button class="btn full" onclick="openLoc()">📍 Add location</button>`}</div>`}
function openLoc(){if(!isMem()){toast('Only members can add locations');return}ld.open=true;draw()}
async function addLoc(){const n=ld.n.trim();if(n.length<2){toast('Enter the location name');return}try{await rpcT('add_location',{p_name:n,p_q:ld.q.trim()||n+', Patna, Bihar'});ld={n:'',q:'',open:false};toast('Location added');draw()}catch(e){toast(errMsg(e))}}
function vSlideBox(){const op=nsl.open&&isAdm();
 return `<div class="card"><div class="row"><h2 style="margin:0">Notices and slides</h2><span class="note">Admin only</span></div>
 <div class="acts"><button class="btn" onclick="openSl('notice')">Add Notice</button><button class="btn alt" onclick="openSl('ad')">Add Slide</button></div>
 ${op?`<label class="l" for="sa">${nsl.k==='ad'?'Company or sponsor name':'Notice text (optional if you add a photo)'}</label><input type="text" id="sa" maxlength="${nsl.k==='ad'?40:500}" value="${esc(nsl.a)}" oninput="nsl.a=this.value">${nsl.k==='ad'?`<label class="l" for="sl2">Link (optional)</label><input type="text" id="sl2" maxlength="200" placeholder="https://" value="${esc(nsl.l)}" oninput="nsl.l=this.value">`:''}${fileIn('slide',0,'Photo')}${nsl.img?`<img class="prev" src="${nsl.img}" alt="">`:''}<div class="acts"><button class="btn" onclick="saveSlide()">Publish</button><button class="ic" onclick="nsl.open=false;draw()">Cancel</button></div>`:''}
 ${isAdm()&&(ads.length||notices.length)?`<p class="note" style="margin-top:12px">Now in the slider</p>${ads.map(a=>`<div class="lb"><span class="nm">Slide · ${esc(a.name)}</span><button class="ic" onclick="delSlide('ad','${a.id}')">Delete</button></div>`).join('')}${notices.map(n=>`<div class="lb"><span class="nm">Notice · ${esc((n.text||'Photo').slice(0,40))}</span><button class="ic" onclick="delSlide('notice','${n.id}')">Delete</button></div>`).join('')}`:''}</div>`}
function openSl(k){if(!isAdm()){toast('Only the admin can add notices and slides');return}nsl.k=k;nsl.open=true;draw()}
function vNoticesL(){return `<div class="card"><h2>📌 Notices</h2>${notices.length?notices.map(n=>`<div style="margin-bottom:12px"><div class="note" style="margin-top:0">${ago(n.t)}</div>${n.text?`<b>${esc(n.text)}</b>`:''}${n.img?`<img class="prev" src="${n.img}" alt="" onclick="openImg(this.src)">`:''}</div>`).join(''):'<div class="empty">No notices yet.</div>'}</div>`}
function vAdsL(){return `<div class="card"><h2>📢 Ads</h2>${ads.length?ads.map(a=>`<div style="margin-bottom:12px"><b>${esc(a.name)}</b>${a.link?` · <a href="${esc(a.link)}" target="_blank" rel="noopener">Visit</a>`:''}${a.img?`<img class="prev" src="${a.img}" alt="" onclick="openImg(this.src)">`:''}</div>`).join(''):'<div class="empty">No ads yet.</div>'}</div>`}
let dq=[],newDq='';
const dqList=()=>dq.length?dq.map(x=>x.text):QUOTES;
const dayQuote=()=>{const L=dqList();return L[Math.floor((Date.now()+19800000)/864e5)%L.length]};
function vMotEdit(){const cur=mots[0]&&mots[0].text,L=dq.length?dq:QUOTES.map(t=>({text:t}));
 return `<div class="card"><div class="row"><b>Message of the day</b><span class="note">Admin only</span></div><p class="note" style="margin:4px 0 8px">${cur?'Everyone sees this message until you change it or go back to the default ones.':'You have not written your own. The default motivations below change every day.'}</p>${cur?`<p style="margin:0 0 8px">“${esc(cur)}”</p>`:''}${motOpen&&isAdm()?`<textarea id="mt" rows="3" maxlength="200" oninput="mtxt=this.value" placeholder="Write the motivation everyone will see">${esc(mtxt)}</textarea><div class="acts"><button class="btn" onclick="saveMot()">Save</button><button class="ic" onclick="motOpen=false;draw()">Cancel</button></div>`:`<div class="acts" style="margin-top:0"><button class="btn" onclick="openMot()">✏️ ${cur?'Change my message':'Write my own'}</button>${cur?'<button class="ic" onclick="clearMot()">Use default motivations</button>':''}</div>`}</div>
 <div class="card"><h2>Default motivations (${L.length})</h2><p class="note" style="margin-top:0">When you have not written your own message, one of these shows each day, in turn. Add or remove as you like.</p>${L.map(x=>`<div class="lb"><span class="nm">${esc(x.text)}</span>${x.id?`<button class="ic" onclick="delQuote('${x.id}')">Remove</button>`:''}</div>`).join('')}<textarea id="nq" rows="2" maxlength="200" placeholder="Add a new default motivation" oninput="newDq=this.value" style="margin-top:8px">${esc(newDq)}</textarea><button class="btn full" onclick="addQuote()">Add motivation</button></div>`}
async function addQuote(){if(newDq.trim().length<3){toast('Write a motivation first');return}try{await rpcT('adm_add_quote',{p_text:newDq.trim()});newDq='';toast('Motivation added');draw()}catch(e){toast(errMsg(e))}}
async function delQuote(id){if(!confirm('Remove this motivation?'))return;try{await rpcT('adm_del_quote',{p_id:id});toast('Removed')}catch(e){toast(errMsg(e))}}
function openMot(){if(!isAdm()){toast('Only the admin can edit this');return}mtxt=(mots[0]&&mots[0].text)||'';motOpen=true;draw()}
async function saveMot(){if(!mtxt.trim()){toast('Write something first');return}try{await rpcT('adm_set_motivation',{p_text:mtxt.trim()});motOpen=false;toast('Motivation updated');draw()}catch(e){toast(errMsg(e))}}
async function clearMot(){try{await rpcT('adm_clear_motivation');motOpen=false;toast('Default quotes are back');draw()}catch(e){toast(errMsg(e))}}
async function rmPhoto(id,w){try{const r=rep(id),mine=!!r&&r.repUid===U.uid;await rpcT('remove_photo',{p_id:id,p_which:w});
 if(w==='after'){if(r){r.after=null;r.st='Assigned'}toast('After photo removed. The task is open again.')}
 else{reports=reports.filter(x=>x.id!==id);if(mine&&r){draft={photo:null,lat:r.lat,lon:r.lon,g:r.g,note:r.note,gpsMsg:''};try{localStorage.setItem('ss_draft',JSON.stringify({g:r.g,note:r.note,lat:r.lat,lon:r.lon}))}catch(e){}tab='report';toast('Photo removed. Add a new photo to send the report again. Otherwise it stays cancelled.')}else toast('Report removed')}
 draw()}catch(e){toast(errMsg(e))}}

/* ---------- NIT Patna campus map ---------- */
let places=[];const bName=k=>{const p=places.find(x=>x.idx===k);return p?p.name:''};
const bCount=k=>reports.filter(r=>r.g===0&&r.bld===k&&(r.st==='Reported'||r.st==='Assigned')).length;
function vCampus(){const W=66,H=58,rows=Math.ceil(BLD.length/5);
 const cells=BLD.map((b,i)=>{const k=i+1,x=6+(i%5)*W,y=6+Math.floor(i/5)*H,n=bCount(k),f=n?'#f4b400':'#d9ece6';
  return `<g><rect x="${x}" y="${y}" width="${W-6}" height="${H-6}" rx="8" fill="${f}" stroke="#0e4f66" stroke-width="1.2"/><text x="${x+(W-6)/2}" y="${y+34}" text-anchor="middle" font-size="9" fill="#0b2b38">${esc(b[0])}</text>${n?`<circle cx="${x+W-17}" cy="${y+13}" r="10" fill="#b3261e"/><text x="${x+W-17}" y="${y+17}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${n}</text>`:''}</g>`}).join('');
 return `<div class="card"><h2>NIT Patna campus map</h2><p class="note" style="margin-top:0">A red number shows how many open waste reports are at that building. This is a simple plan, not to scale.</p><svg viewBox="0 0 ${6+5*W} ${6+rows*H}" style="width:100%;height:auto" role="img" aria-label="NIT Patna campus plan">${cells}</svg></div>`}
function bldSel(){return `<label class="l" for="bld">Which building are you near?</label><select id="bld" onchange="draft.bld=+this.value||null"><option value="">Choose a building</option>${BLD.map((b,i)=>`<option value="${i+1}"${draft.bld===i+1?' selected':''}>${esc(b[1])}</option>`).join('')}</select>`}
/* ---------- photo removed by a member or admin ---------- */
function vNeedPhoto(){const m=reports.filter(r=>U&&r.repUid===U.uid&&!r.photo);if(!m.length)return '';
 return m.map(r=>`<div class="card" style="border-color:#b3261e"><b>Admin or members removed your photo.</b><p class="note" style="margin-top:6px">Please add your photo to report it, or delete this report.</p><div class="gps">${esc(gh(r.g).n)}${r.bld&&bName(r.bld)?' · '+esc(bName(r.bld)):''} · ${esc(r.note)}</div>${fileIn('before',r.id,'Add your photo')}<div class="acts"><button class="btn red" onclick="delMine('${r.id}')">Delete this report</button></div></div>`).join('')}
async function delMine(id){try{await rpcT('delete_own_report',{p_id:id});reports=reports.filter(x=>x.id!==id);toast('Report deleted');draw()}catch(e){toast(errMsg(e))}}
const pendN=()=>reports.filter(r=>r.st==='Pending'&&r.photo).length;
async function rmPhoto(id,w){try{const r=rep(id),mine=!!r&&r.repUid===U.uid;await rpcT('remove_photo',{p_id:id,p_which:w});
 if(w==='after'){if(r){r.after=null;r.st='Assigned'}toast('After photo removed. The task is open again.')}
 else if(mine&&r){reports=reports.filter(x=>x.id!==id);draft={photo:null,lat:r.lat,lon:r.lon,g:r.g,bld:r.bld||null,note:r.note,vols:String(r.volsNeeded||1),gpsMsg:''};try{localStorage.setItem('ss_draft',JSON.stringify({g:r.g,bld:r.bld||null,note:r.note,lat:r.lat,lon:r.lon}))}catch(e){}tab='report';toast('Photo removed. Add a new photo to send the report again. Otherwise it stays cancelled.')}
 else{if(r){r.photo=null;r.after=null;r.st='Pending'}toast('Photo removed. The user has been asked to add a new one.')}
 draw()}catch(e){toast(errMsg(e))}}
/* ---------- admin page ---------- */
function vSlideAdmin(){const op=nsl.open;
 return `<div class="card"><h2>Notices and advertisements</h2><p class="note" style="margin-top:0">They slide in the white box on Report, Hotspots, Status, Leaders and Community.</p>
 <div class="acts"><button class="btn" onclick="openSl('notice')">Add Notice</button><button class="btn alt" onclick="openSl('ad')">Add Advertisement</button><button class="btn alt" onclick="openSl('instr')">Add Instruction</button></div>
 ${op?`<label class="l" for="sa">${nsl.k==='ad'?'Company name':(nsl.k==='instr'?'Instruction for users (optional if you add a photo)':'Notice text (optional if you add a photo)')}</label><input type="text" id="sa" maxlength="${nsl.k==='ad'?40:500}" value="${esc(nsl.a)}" oninput="nsl.a=this.value">${nsl.k==='ad'?`<label class="l" for="sl2">Link (optional)</label><input type="text" id="sl2" maxlength="200" placeholder="https://" value="${esc(nsl.l)}" oninput="nsl.l=this.value">`:''}${fileIn('slide',0,'Photo')}${nsl.img?`<img class="prev" src="${nsl.img}" alt="">`:''}<div class="acts"><button class="btn" onclick="saveSlide()">Publish</button><button class="ic" onclick="nsl.open=false;draw()">Cancel</button></div>`:''}
 ${ads.length||notices.length?`<p class="note" style="margin-top:12px">Now in the slider</p>${ads.map(a=>`<div class="lb"><span class="nm">Ad · ${esc(a.name)}</span><button class="ic" onclick="delSlide('ad','${a.id}')">Delete</button></div>`).join('')}${notices.map(n=>`<div class="lb"><span class="nm">Notice · ${esc((n.text||'Photo').slice(0,40))}</span><button class="ic" onclick="delSlide('notice','${n.id}')">Delete</button></div>`).join('')}`:''}</div>`}
function vLocAdmin(){const live=locs.filter(l=>!l.removed);
 return `<div class="card"><h2>Locations</h2><p class="note" style="margin-top:0">Locations you add show in the Google map selector and in the report form.</p><label class="l" for="ln">Name</label><input type="text" id="ln" maxlength="40" value="${esc(ld.n)}" oninput="ld.n=this.value"><label class="l" for="lq">Place name or coordinates (optional)</label><input type="text" id="lq" maxlength="100" placeholder="Example: 25.6205, 85.1730" value="${esc(ld.q)}" oninput="ld.q=this.value"><button class="btn full" onclick="addLoc()">Add location</button>
 ${live.length?`<p class="note" style="margin-top:12px">Added by you</p>${live.map(l=>`<div class="lb"><span class="nm">${esc(l.name)}</span><button class="ic" onclick="rmLoc(${l.idx})">Remove</button></div>`).join('')}`:''}</div>`}
async function rmLoc(i){if(!confirm('Remove this location? Old reports keep its name.'))return;try{await rpcT('adm_remove_location',{p_idx:i});toast('Location removed')}catch(e){toast(errMsg(e))}}
let vEdit={};
function vReportsAdmin(){const rs=reports.slice(0,40);
 const row=r=>{const ed=vEdit[r.id]!==undefined,V=Array.isArray(r.vols)?r.vols:[];
  return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px"><div class="lb" style="border-bottom:0;padding:0"><span class="nm"><b>${esc(gh(r.g).n)}</b> · ${esc(r.st)}${r.done?' · Done':''}${r.photo?'':' · needs photo'}<div class="note">${esc(r.note)} · by ${esc(r.repName)} · ${ago(r.t)}</div></span>${r.photo?`<img src="${r.photo}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:10px" onclick="openImg(this.src)">`:''}${r.st==='Cleaned'?`<button class="ic" onclick="reopenR('${r.id}')">Reopen</button>`:''}${r.st==='Cleaned'&&!r.done?`<button class="ic" onclick="doneR('${r.id}')">Done</button>`:''}<button class="ic" onclick="delR('${r.id}')">Delete</button></div>
  <div class="lb" style="border-bottom:0;padding:8px 0 0;margin-top:8px;border-top:1px dashed var(--line)"><span class="nm">Number of volunteers required: ${ed?`<input type="text" inputmode="numeric" maxlength="2" value="${esc(vEdit[r.id])}" style="width:64px" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,2);vEdit['${r.id}']=this.value" aria-label="Volunteers required">`:`<b>${r.volsNeeded||1}</b>`}<span class="note"> · ${V.length} joined</span></span><button class="ic" title="Edit" aria-label="Edit number of volunteers" onclick="editVN('${r.id}')">✏️</button>${ed?`<button class="btn" onclick="saveVN('${r.id}')">Save</button>`:''}</div></div>`};
 return `<div class="card"><h2>All reports</h2><p class="note" style="margin-top:0">Delete a wrong report, reopen a cleaned one, or press Done to lock a fully cleaned one. Use the pencil to change how many volunteers are needed.</p>${rs.length?rs.map(row).join(''):'<p class="note">No reports.</p>'}</div>`}

function qrClean(file,cb){const fr=new FileReader();fr.onerror=()=>cb(null);fr.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{try{
 const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0);
 const d=g.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i]>=245&&d[i+1]>=245&&d[i+2]>=245){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
 let sx=0,sy=0,sw=W,sh=H;if(x1-x0>=100&&y1-y0>=100){sx=x0;sy=y0;sw=x1-x0+1;sh=y1-y0+1}
 const k=Math.min(1,480/Math.max(sw,sh)),o=document.createElement('canvas');o.width=Math.max(1,Math.round(sw*k));o.height=Math.max(1,Math.round(sh*k));const q=o.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(c,sx,sy,sw,sh,0,0,o.width,o.height);cb(o.toDataURL('image/png'))}catch(e){cb(null)}};im.src=fr.result};fr.readAsDataURL(file)}

function vGuide(){return `<div class="card"><details><summary style="font-weight:700;cursor:pointer;font-size:17px">📖 How Swach Nova works</summary>
 <div style="margin-top:10px;line-height:1.5;font-size:15px">
 <p><b>1. Report waste.</b> Open Report. Add a photo, choose the ghat (for NIT Patna Campus also choose the place), add your exact location if you can, and write what kind of waste it is. Then press Submit.</p>
 <p><b>Guest mode.</b> You can enter as a guest without a login. Your name stays hidden. Guests can report waste and look at Hotspots, Leaders, Community and this guide. Volunteer, member and admin need a login. The admin can switch guest mode on or off.</p>
 <p><b>2. Members approve.</b> Every new report goes to the members first. When a member approves it, it shows in Status and you get 10 points. If a member declines it, it is deleted.</p>
 <p><b>3. Cleaning.</b> Approved reports are visible to the person who reported, to members and admins, and to the volunteer who accepts the task. Switch to Volunteer at the top, press Accept task (+5 points), clean the place and upload an after photo (+30 points).</p>

function applyPrefs(){const h=document.documentElement,c=h.classList;
 if(PR.theme==='auto')h.removeAttribute('data-theme');else h.setAttribute('data-theme',PR.theme);
 const dk=isDark();c.toggle('dk',dk);
 ['t2','t3','fr','fs','d1','d3','sq','rm','hc','ul','big','cb','cs','cg','cl','co'].forEach(x=>c.remove(x));
 if(PR.size==='l')c.add('t2');if(PR.size==='x')c.add('t3');if(PR.font==='r')c.add('fr');if(PR.font==='s')c.add('fs');
 if(PR.dens==='c')c.add('d1');if(PR.dens==='r')c.add('d3');if(PR.round==='s')c.add('sq');
 if(PR.rm)c.add('rm');if(PR.hc)c.add('hc');if(PR.ul)c.add('ul');if(PR.big)c.add('big');if(PR.cb)c.add('cb');
 {const E=bgNow();if(E.card==='soft')c.add('cs');if(E.card==='glass')c.add('cg');if(E.card==='lift')c.add('cl');if(E.card==='line')c.add('co')}
 h.setAttribute('data-pe',PR.pe);h.style.setProperty('--mw',{m:'480px',a:'680px',d:'940px'}[PR.lay]||'680px');
 const ac=settings.look_accent;if(ac&&!dk)h.style.setProperty('--river',ac);else h.style.removeProperty('--river');
 applyBg()}
function applyBg(){const el=$('bgl');if(!el)return;const L=[],D=BG.dim/100;
 if(D>0)L.push(['linear-gradient(rgba(0,0,0,'+D+'),rgba(0,0,0,'+D+'))','auto','no-repeat']);
 if(BG.pat==='dots')L.push(['radial-gradient(rgba(0,0,0,.14) 1.5px,transparent 1.7px)','22px 22px','repeat']);
 if(BG.pat==='grid'){L.push(['linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px)','28px 28px','repeat']);L.push(['linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px)','28px 28px','repeat'])}
 if(BG.pat==='waves')L.push(['url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2760%27 height=%2730%27%3E%3Cpath d=%27M0 15 Q15 0 30 15 T60 15%27 fill=%27none%27 stroke=%27rgba(0,0,0,.12)%27 stroke-width=%271.5%27/%3E%3C/svg%3E")','60px 30px','repeat']);
 const pid=BG.preset||settings.look_bg||'default';
 if(BG.mode==='photo'&&bgImg)L.push(['url('+bgImg+')','cover','no-repeat']);
 else if(BG.mode==='color')L.push(['linear-gradient('+BG.color+','+BG.color+')','auto','no-repeat']);
 else if(PRESETS[pid])L.push([PRESETS[pid],'auto','no-repeat']);
 el.style.backgroundImage=L.map(x=>x[0]).join(',');el.style.backgroundSize=L.map(x=>x[1]).join(',');el.style.backgroundRepeat=L.map(x=>x[2]).join(',');el.style.backgroundPosition='center';
 buildSky(!(BG.mode==='photo'&&bgImg)&&BG.mode!=='color'&&pid==='default');buildFx()}

let skyPh='',skyT=null;
const istH=()=>new Date(Date.now()+(330+new Date().getTimezoneOffset())*6e4).getHours();
const skyPhase=h=>h>=7&&h<17?'d':(h>=5&&h<7)||(h>=17&&h<19)?'g':'n';
function skyHtml(ph){let st='',cl='',dy='',i;
 if(ph==='n')for(i=0;i<46;i++)st+=`<i class="st" style="left:${Math.random()*100}%;top:${Math.random()*50}%;animation-delay:${-Math.random()*4}s;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px"></i>`;
 if(ph!=='n')for(i=0;i<5;i++)cl+=`<b class="cl" style="top:${5+i*8}%;animation-duration:${70+i*19}s;animation-delay:${-i*15}s"></b>`;
 if(ph!=='d')for(i=0;i<9;i++)dy+=`<u class="dy" style="left:${5+i*11}%;top:${8+(i*37)%75}%;animation-delay:${-i*.7}s"></u>`;
 return `<div class="sc ${ph}"><div class="ly sk0"></div><div class="ly ${ph==='n'?'mo':'su'}"></div><div class="ly stl">${st}</div><div class="ly cls">${cl}</div><div class="ly hl"></div><div class="ly gh"><span style="width:55%"></span><span style="width:78%"></span><span style="width:100%"></span></div><div class="ly rv">${dy}</div></div>`}
function buildSky(on){const el=$('bgl'),h=document.documentElement;clearInterval(skyT);let sk=$('sky');
 if(!el)return;if(!on){if(sk)sk.remove();skyPh='';h.classList.remove('nt');return}
 const ph=skyPhase(istH());h.classList.toggle('nt',ph==='n');
 if(!sk||skyPh!==ph){if(sk)sk.remove();skyPh=ph;sk=document.createElement('div');sk.id='sky';sk.innerHTML=skyHtml(ph);el.appendChild(sk)}
 skyT=setInterval(()=>buildSky(true),6e4)}
const skyMove=(x,y)=>{const e=document.querySelector('#sky .sc');if(e&&!PR.rm){e.style.setProperty('--px',x);e.style.setProperty('--py',y)}};
addEventListener('pointermove',e=>skyMove((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2),{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;skyMove(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30)))},{passive:true});
function buildFx(){const f=$('fx');if(!f)return;f.innerHTML='';const e=FXE[BG.fx];if(!e||PR.rm)return;
 const n={f:8,n:16,m:28}[BG.cnt]||16,sp={c:1.7,n:1,l:.6}[BG.spd]||1;
 for(let i=0;i<n;i++){const x=document.createElement('span');x.className='fp';x.textContent=e[0];const d=(9+Math.random()*10)*sp;
  x.style.left=(Math.random()*100)+'%';x.style.fontSize=(14+Math.random()*16)+'px';x.style.setProperty('--dx',(Math.random()*80-40)+'px');
  if(e[1]==='tw'){x.style.top=(Math.random()*100)+'%';x.style.animation='tw '+((2+Math.random()*3)*sp)+'s ease-in-out infinite';x.style.animationDelay=(-Math.random()*4)+'s'}
  else{x.style.animation=e[1]+' '+d+'s linear infinite';x.style.animationDelay=(-Math.random()*d)+'s'}
  f.appendChild(x)}}

async function saveAccount(){const n=$('pn').value.trim(),ph=$('pp').value.trim(),em=$('aem').value.trim(),np=$('npw').value,np2=$('npw2').value,cp=$('cpw').value;
 if(!n){toast('Name cannot be empty');return}if(!/^[0-9+ ]{0,15}$/.test(ph)){toast('Phone must be digits only');return}

 if(pwChange&&np.length<6){toast('New password needs at least 6 characters');return}if(pwChange&&np!==np2){toast('The two new passwords do not match');return}
 try{if(emChange||pwChange){if(!cp){toast('Enter your current password');return}const {error:e1}=await sb.auth.signInWithPassword({email:U.email,password:cp});if(e1)throw new Error('Current password is wrong');
   if(emChange){const {error}=await sb.auth.updateUser({email:em});if(error)throw error}
   if(pwChange){const {error}=await sb.auth.updateUser({password:np});if(error)throw error}}
  await db.collection('users').doc(U.uid).update({name:n.slice(0,30)});await db.collection('user_private').doc(U.uid).update({phone:ph});
  toast(emChange?'Saved. Check your new email for the confirmation link':'Saved');$('cpw').value='';$('npw').value='';$('npw2').value=''}catch(e){toast(errMsg(e))}}

/* searchable selects */
function enhanceSelects(){
 if(!window._ssOut){window._ssOut=1;document.addEventListener('click',e=>{document.querySelectorAll('.ssp').forEach(p=>{if(p.style.display!=='none'&&!p.parentNode.contains(e.target))p.style.display='none'})})}
 document.querySelectorAll('#app select').forEach(s=>{if(s.dataset.se||s.options.length<3)return;s.dataset.se=1;
  const w=document.createElement('div'),b=document.createElement('button'),p=document.createElement('div'),q=document.createElement('input'),l=document.createElement('div');
  w.className='ssw';if(s.style.flex)w.style.flex=s.style.flex;b.type='button';b.className='ssb';b.setAttribute('aria-haspopup','listbox');
  p.className='ssp';p.style.display='none';q.type='text';q.placeholder='Type to search';q.setAttribute('aria-label','Search the list');q.autocomplete='off';l.className='ssl';p.appendChild(q);p.appendChild(l);
  s.parentNode.insertBefore(w,s);w.appendChild(b);w.appendChild(p);w.appendChild(s);s.style.display='none';
  const items=[...s.options].map(o=>({v:o.value,t:o.text})),lab=()=>{const o=s.options[s.selectedIndex];b.textContent=(o?o.text:'Select')+'  ▾'},close=()=>{p.style.display='none'};
  const pick=o=>{close();if(s.value!==o.v){s.value=o.v;lab();s.dispatchEvent(new Event('change',{bubbles:true}))}else lab()};
  const show=()=>{const f=q.value.trim().toLowerCase(),m=items.filter(o=>!f||o.t.toLowerCase().includes(f));l.innerHTML='';
   if(!m.length){const d=document.createElement('div');d.className='sso';d.textContent='No match';l.appendChild(d);return m}
   m.forEach(o=>{const d=document.createElement('div');d.className='sso'+(o.v===s.value?' on':'');d.textContent=o.t;d.onclick=()=>pick(o);l.appendChild(d)});return m};
  b.onclick=()=>{if(p.style.display!=='none'){close();return}document.querySelectorAll('.ssp').forEach(x=>x.style.display='none');q.value='';show();p.style.display='block';q.focus()};
  q.oninput=show;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const m=show();if(m.length)pick(m[0])}else if(e.key==='Escape')close()};
  lab()})}

  else if(k==='rip'){const z=120+Math.random()*120;x.textContent='';x.style.cssText+=';width:'+z+'px;height:'+z+'px;margin-left:'+(-z/2)+'px;top:'+(8+Math.random()*80)+'%;border:2px solid rgba(255,255,255,.55);border-radius:50%';x.style.animation='rip '+(d*.6)+'s ease-out infinite';dl()}
  else if(k==='mist'){const w=200+Math.random()*220;x.textContent='';x.style.cssText+=';width:'+w+'px;height:'+(w*.35)+'px;border-radius:50%;left:0;top:'+(Math.random()*85)+'%;background:rgba(255,255,255,.22);filter:blur(26px)';x.style.animation='sail '+(d*5)+'s linear infinite';dl()}
  else if(k==='sail'){const dd=d*3;x.style.left='0';x.style.top=(Math.random()*90)+'%';x.style.opacity=.7;x.style.animation='sail '+dd+'s linear infinite';x.style.animationDelay=(-Math.random()*dd)+'s'}
  else if(k==='ff'){x.style.top=(Math.random()*100)+'%';x.style.fontSize=(6+Math.random()*7)+'px';x.style.color='#ffe066';x.style.textShadow='0 0 8px #ffd54a,0 0 16px #ffb300';x.style.animation='ff '+(d*.6)+'s ease-in-out infinite';dl()}
  else{x.style.animation=k+' '+d+'s linear infinite';dl()}
  f.appendChild(x)}}
