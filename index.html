<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChapterLoop</title>
<style>
:root{--bg:#f6f7f5;--cd:#fff;--tx:#1b1f1d;--mu:#68706b;--bd:#dde1dd;--ac:#0f766e;--acb:#d9f1ee;--ok:#15803d;--okb:#dcf3e3;--no:#b91c1c;--nob:#fbe0e0;--wn:#a16207;--wnb:#fdf0c9}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--cd:#1b1f1d;--tx:#e8ebe9;--mu:#9aa39e;--bd:#2c332f;--ac:#4fd1c5;--acb:#123b37;--ok:#6ee7a0;--okb:#143322;--no:#fca5a5;--nob:#3b1717;--wn:#fcd34d;--wnb:#3a2e0d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
#app{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}.mu{color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:40px}
input[type=text],input:not([type]),select,textarea{width:100%}input[type=checkbox]{min-height:0;width:20px;height:20px}
button{cursor:pointer}button.on,button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}button.p{width:100%;margin-top:8px;font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--acb);color:var(--ac);border-color:var(--ac)}
.row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.q{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin:5px 0;background:var(--cd)}.q.on{border-color:var(--ac);background:var(--acb)}
.q .sn{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;color:var(--mu)}.q select{width:92px;min-height:32px;padding:2px}.th{height:34px;max-width:100%}
.list{max-height:46vh;overflow:auto}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{border:0;background:none;flex:1;max-width:120px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}#nav button.on{color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center}.tm{font-weight:600;background:var(--wnb);color:var(--wn);padding:2px 12px;border-radius:8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}.qi{max-width:100%;display:block}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.pad button{font-size:20px;min-height:48px}
.disp{border:1px solid var(--ac);border-radius:8px;padding:8px 12px;font-size:22px;text-align:right;min-height:46px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:8px;margin-right:4px}.right{background:var(--okb);color:var(--ok)}.wrong{background:var(--nob);color:var(--no)}.skip,.nokey{background:var(--wnb);color:var(--wn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button{min-height:34px;padding:4px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.big{font-size:24px;font-weight:600}
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pg button{min-height:40px;padding:0}
.ans{background:var(--okb)}.mkd{background:var(--wnb)}.cur{border:2px solid var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9}
.vw{max-height:52vh;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px}.in{position:relative;width:100%}.in canvas{width:100%;display:block}
#sb{position:absolute;border:2px solid var(--ac);background:var(--acb);opacity:.5;display:none}
.hs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}@media(max-width:480px){.hs{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CD='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const SUBJ=['Organic Chemistry','Inorganic Chemistry','Physical Chemistry','Physics','Maths','Test'];
const TLV=['JEE Main','JEE Advanced'],TKD=[['Minor','Minor test (part syllabus)'],['Major','Major test (full syllabus)']];
const tName=u=>(u.tl||TLV[0])+' - '+(u.tk||'Minor')+' Test';
const RS=['Concept gap','Silly mistake','Guess','Out of time'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const fmt=s=>{s=Math.max(0,Math.round(s));const p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
function toast(m){let t=$('#toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- storage: every read/write goes through load() and save() ---------- */
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem('tm_db'))}catch(e){}DB=DB||{};DB.profile=DB.profile||{name:'',target:'JEE Advanced 2027'};DB.chap=DB.chap||{};DB.tests=DB.tests||[];DB.set=DB.set||{c:4,w:1,nw:0};DB.set.look=DB.set.look||'auto';Object.values(DB.chap).forEach(c=>{c.all=c.all||{};c.wrong=c.wrong||{};c.bm=c.bm||{};['wrong','bm'].forEach(K=>Object.values(c[K]).forEach(q=>{const a=q.sh&&c.all[q.id];if(a){if(!q.img&&a.img)q.img=a.img;if(!q.sol&&a.sol)q.sol=a.sol}}))})}
function slim(){const o={...DB,chap:{}};for(const k in DB.chap){const c=DB.chap[k],n={...c};['wrong','bm'].forEach(K=>{n[K]={};for(const id in c[K]){const q=c[K][id],a=c.all[id];n[K][id]=a&&((q.img&&q.img===a.img)||(q.sol&&q.sol===a.sol))?{...q,img:q.img&&q.img===a.img?undefined:q.img,sol:q.sol&&q.sol===a.sol?undefined:q.sol,sh:1}:q}});o.chap[k]=n}return o}
function save(){DB.ts=Date.now();clearTimeout(window.PT);window.PT=setTimeout(push,1500);try{const j=JSON.stringify(slim());localStorage.setItem('tm_db',j);if(j.length>4.2e6&&!window._sw){window._sw=1;toast('Storage is almost full ('+(j.length/1e6).toFixed(1)+' MB of about 5 MB). Export a backup soon.')}}catch(e){toast('Could not save. Storage is full or blocked. Export a backup from Profile.')}}
load();

/* ---------- chapters: one record per chapter name, reused every time ---------- */
const findChap=n=>{const k=norm(n);return k&&Object.values(DB.chap).find(c=>c.k===k)};
function getChap(n,subj){let c=findChap(n);if(!c)c=DB.chap[norm(subj)+'|'+norm(n)]={k:norm(n),name:n.trim(),subj,wrong:{},bm:{},all:{}};return c}
const cnt=(c,k)=>Object.keys(c[k]).length;

let S={tab:'test',sub:0,sub2:0,run:null,sum:null,snaps:{},bank:{kind:'all',subj:SUBJ[0],ck:null},hf:'',
 su:{chap:'',subj:SUBJ[0],mode:'text',qs:[],sel:{},key:'',pdf:null,pdfName:'',pg:1,draw:false,tm:'auto',mins:60,msg:''}};

const freshSU=()=>({chap:'',subj:SUBJ[0],mode:'text',qs:[],sel:{},key:'',pdf:null,pdfName:'',pg:1,draw:false,tm:'auto',mins:60,msg:''});
const IC={test:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>',bank:'<path d="M6 4h12v16l-6-4-6 4z"/>',hist:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',prof:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'};
Object.assign(IC,{usr:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>',pal:'<path d="M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2-.6-1.2.2-2.5 1.5-2.5H18a3 3 0 003-3c0-5-4-10.5-9-10.5z"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',dat:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6"/>',shr:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11l8-4M8 13l8 4"/>'});
const ico=n=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
$('#nav').innerHTML=[['test','Test'],['bank','Bank'],['hist','History'],['prof','Settings']].map(([t,l])=>`<button data-t="${t}" onclick="S.tab='${t}';S.sum=null;S.st=null;S.qd=null;render()">${ico(t)}${l}</button>`).join('');
const seg=(ls,cur,fn)=>`<div class="seg">${ls.map((l,i)=>`<button class="${i==cur?'on':''}" onclick="${fn}(${i})">${l}</button>`).join('')}</div>`;
const snip=q=>q.img?`<img class="th" src="${q.img}" alt="">`:esc((q.text||'').slice(0,80));

function render(){applyLook();
 let h;if(S.run)h=vRun();else if(S.qd)h=vQD();else if(S.sum)h=vSum();else h={test:vTest,bank:vBank,hist:vHist,prof:vProf}[S.tab]();
 if(!S.run&&!S.sum&&!S.qd)h=hdr()+h;$('#app').innerHTML=h;$('#nav').style.display=S.run?'none':'flex';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab&&!S.sum));
 if(!S.run&&!S.sum&&!S.qd&&S.tab=='test'&&S.sub==0&&S.su.mode=='crop'&&S.su.pdf)renderPg();
}

/* ---------- Test tab: setup ---------- */
const nm=(a)=>a.map((q,i)=>(q.n=i+1,q));
function chapNote(){const c=findChap(S.su.chap);return c?`Saved chapter (${esc(c.subj)}): ${cnt(c,'wrong')} wrong, ${cnt(c,'bm')} bookmarked`:(S.su.chap.trim()?'New chapter will be created':'')}
function subjIn(v){const u=S.su;u.subj=v;if(v=='Test'){u.tl=u.tl||TLV[0];u.tk=u.tk||'Minor';u.chap=tName(u)}else if(/ Test$/.test(u.chap))u.chap='';render()}
function chapIn(v){const u=S.su;u.chap=v;const c=findChap(v);if(c){u.subj=c.subj;const e=$('#subj');if(e)e.value=c.subj}$('#cn').textContent=chapNote().replace(/&amp;/g,'&')}
function vTest(){const u=S.su;let h='';
 {
  h+=`<div class="card"><label for="subj">Subject</label><select id="subj" onchange="subjIn(this.value)">${SUBJ.map(x=>`<option${x==u.subj?' selected':''}>${x}</option>`).join('')}</select>
  ${u.subj=='Test'?`<label for="tl">Exam</label><select id="tl" onchange="S.su.tl=this.value;S.su.chap=tName(S.su);render()">${TLV.map(x=>`<option${x==(u.tl||TLV[0])?' selected':''}>${x}</option>`).join('')}</select><label for="tk">Test type</label><select id="tk" onchange="S.su.tk=this.value;S.su.chap=tName(S.su);render()">${TKD.map(x=>`<option value="${x[0]}"${x[0]==(u.tk||'Minor')?' selected':''}>${x[1]}</option>`).join('')}</select><div class="mu">Saved as: ${esc(tName(u))}</div>`:`<label for="chap">Chapter</label><input id="chap" list="cl" value="${esc(u.chap)}" oninput="chapIn(this.value)" placeholder="Type a chapter, e.g. IUPAC" autocomplete="off"><datalist id="cl">${Object.values(DB.chap).filter(c=>c.subj!='Test').map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="mu" id="cn">${chapNote()}</div>`}</div>
  <div class="card"><label>PDF</label><input type="file" accept="application/pdf" onchange="pickPdf(this.files[0])"><div class="mu">${esc(u.msg||u.pdfName)}</div>
  
  <label for="key">Answer key</label><textarea id="key" rows="2" placeholder="1-B, 2-C, 3-4.5" oninput="S.su.key=this.value">${esc(u.key)}</textarea></div>`;
  if(u.mode=='crop'&&u.pdf)h+=`<div class="card" id="cropc"><div class="row">${cropEd(u)?'<button onclick="cropBack()">Back</button>':''}<button onclick="pgGo(-1)">Prev page</button><span class="mu" style="text-align:center">Page ${u.pg} of ${u.pdf.numPages}</span><button onclick="pgGo(1)">Next page</button></div><div class="row"><button class="${u.draw?'on':''}" onclick="S.su.draw=!S.su.draw;render()">Draw: ${u.draw?'on (drag over a question)':'off (scroll)'}</button></div>${cropLbl(u)}
   <div class="vw"><div class="in" id="vw" style="touch-action:${u.draw?'none':'auto'}" onpointerdown="pd(event)" onpointermove="pm(event)" onpointerup="pu()"><canvas id="cv"></canvas><div id="sb"></div></div></div></div>`+pendCard(u);
  if(u.qs.length){const n=Object.keys(u.sel).length;
   h+=edCard(u);h+=`<div class="card"><b>${n} of ${u.qs.length} selected</b><div class="mu">Range: choose from and to (the # numbers), for example 20 to 40</div>${(u.secs||[]).length>1?`<div class="chips">${u.secs.map(x=>`<button onclick="togSec('${x}')">${esc(x)} (${u.qs.filter(q=>q.sec==x).length})</button>`).join('')}</div>`:''}<div class="row"><input id="r1" type="number" placeholder="From Q" min="1"><input id="r2" type="number" placeholder="To Q" min="1"><button onclick="rng()">Select range</button></div><div class="row"><button onclick="selAll()">All</button><button onclick="S.su.sel={};render()">Clear</button></div>
   <div class="list">${u.qs.map((q,i)=>`<div class="q ${u.sel[i]?'on':''}" id="qr${i}"><input type="checkbox" aria-label="Select Q${q.n}" ${u.sel[i]?'checked':''} onchange="tog(${i})"><b>#${q.n}${q.sec?' '+esc(q.sec.replace('Exercise','Ex'))+' Q'+q.qn:(q.qn&&q.qn!=q.n?' (PDF Q'+q.qn+')':'')}</b><span class="sn" style="cursor:pointer" onclick="qdOpen(${i})">${q.flag?`<span title="${esc(q.flag)}" style="color:#e8a000">&#9888; ${esc(q.flag)}</span><br>`:''}${snip(q)}</span><button aria-label="Edit" onclick="edGo(${i})">Edit</button>${u.mode=='crop'?`<button aria-label="Delete" onclick="delQ(${i})">x</button>`:''}</div>`).join('')}</div>
   <div style="margin-top:10px"><b>Save to bank</b><div class="mu">Saved under the chapter name above.</div><button class="p" style="width:100%;margin:6px 0" onclick="saveBank(1)">Save all questions</button>${(u.secs||[]).length?`<div class="mu">Save exercise-wise</div><div class="chips">${u.secs.map((x,k)=>`<button onclick="saveSec(${k})">Save ${esc(x)}</button>`).join('')}</div>`:''}<button style="width:100%;margin-top:6px" onclick="saveBank()">Add only selected questions</button></div>
   </div>`}
 }
 {
  const sel=u.qs.filter((q,i)=>u.sel[i]),auto=autoSec(sel)/60;
  h+=`<div class="card"><b>Time</b>${seg(['Auto','Set my own'],u.tm=='auto'?0:1,'setTm')}
  ${u.tm=='auto'?`<p class="mu">Auto time: ${Math.round(auto)} min (2 min per MCQ, 4 min per numerical)</p>`:`<label for="mins">Total minutes</label><input id="mins" type="number" min="1" value="${u.mins}" oninput="S.su.mins=+this.value">`}</div>
  <div class="card"><b>Marking scheme</b><div class="row"><div><label for="mc">Correct</label><input id="mc" type="number" value="${DB.set.c}" oninput="DB.set.c=+this.value;save()"></div><div><label for="mw">Wrong MCQ (minus)</label><input id="mw" type="number" value="${DB.set.w}" oninput="DB.set.w=+this.value;save()"></div><div><label for="mn">Wrong numerical (minus)</label><input id="mn" type="number" value="${DB.set.nw}" oninput="DB.set.nw=+this.value;save()"></div></div><p class="mu">Check the current JEE rule and change these if needed.</p></div>
  <div class="card"><b>${sel.length} questions selected</b><button class="p" onclick="startTest()">Start test</button><div class="row"><button onclick="copyQs()">Copy data</button></div><label for="pq">Paste a question set (from Claude)</label><textarea id="pq" rows="3" placeholder="Paste the copied list here"></textarea><div class="row"><button onclick="applyQs()">Add to list</button><button class="on" onclick="applyQs(1)">Add and start test</button></div><button onclick="copyFmt()">Copy example format</button><p class="mu">Pasted questions are text only. Questions with figures or graphs need the PDF crop.</p></div>`}
 return h}
const setSub=i=>{S.sub=i;render()};
const setMode=i=>{S.su.mode=i?'crop':'text';S.su.qs=[];S.su.sel={};S.su.pdf=null;S.su.pdfName='';S.su.msg='';render()};
const setTm=i=>{S.su.tm=i?'custom':'auto';render()};
const tog=i=>{S.su.sel[i]?delete S.su.sel[i]:S.su.sel[i]=1;render()};
const selAll=()=>{S.su.qs.forEach((q,i)=>S.su.sel[i]=1);render()};
function rng(){const a=+$('#r1').value,b=+$('#r2').value;if(!a||!b||a>b)return toast('Enter a valid range, like 1 to 40');S.su.sel={};S.su.qs.forEach((q,i)=>{if(q.n>=a&&q.n<=b)S.su.sel[i]=1});render()}
function delQ(i){const u=S.su,ns={};u.qs.splice(i,1);Object.keys(u.sel).forEach(k=>{k=+k;if(k<i)ns[k]=1;else if(k>i)ns[k-1]=1});u.sel=ns;nm(u.qs);render()}
const autoSec=a=>a.reduce((t,q)=>t+(q.type=='num'?240:120),0);

/* ---------- PDF reading ---------- */
function ld(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
async function initPdf0(){if(window._pi)return;try{const w=await(await fetch(CD+'pdf.worker.min.js')).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}))}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=CD+'pdf.worker.min.js'}window._pi=1}
async function initPdf(){if(window._pi)return;let b=CD;if(typeof pdfjsLib=='undefined'){b='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';try{await ld(b+'pdf.min.js')}catch(e){throw new Error('PDF library could not load. Check internet.')}}
 const wu=b+'pdf.worker.min.js';try{const w=await(await fetch(wu)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}))}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=wu}window._pi=1}
const isVis=q=>!q.text||q.text.length<25||(q.opts&&q.opts.some(o=>!o.trim()))||/\b(above|given|shown)\b|following\s+(compound|structure)|name of\s*(is\s*:?)?\s*$|(compound|structure)\s*(is|are)?\s*:?\s*$/i.test(q.text);
/* ===== ChapterLoop PDF parser (layout based). Input: pages=[{W,H,items:[{s,x,y,h,w}]}]  (pdf units, y up) ===== */
const CLP_SYM={a:'α',b:'β',c:'χ',d:'δ',e:'ε',f:'φ',g:'γ',h:'η',i:'ι',k:'κ',l:'λ',m:'μ',n:'ν',o:'ο',p:'π',q:'θ',r:'ρ',s:'σ',t:'τ',u:'υ',w:'ω',x:'ξ',y:'ψ',z:'ζ',D:'Δ',F:'Φ',G:'Γ',L:'Λ',P:'Π',Q:'Θ',S:'Σ',W:'Ω',Y:'Ψ'},CLP_PUA={0xAE:'→',0xAC:'←',0xB1:'±',0xB4:'×',0xB7:'•',0xA3:'≤',0xB3:'≥',0xB9:'≠',0xBB:'≈',0xB0:'°',0xA5:'∞',0xD6:'√',0xB6:'∂',0xD1:'∇',0xB5:'∝',0xDB:'⇔',0xDE:'⇒',0xD0:'∠',0xD7:'⋅',0xA2:'′'};
function CLP_sym(s){return s.replace(/[\uF020-\uF0FF]/g,c=>{const k=c.charCodeAt(0)-0xF000;return CLP_PUA[k]||CLP_SYM[String.fromCharCode(k)]||''}).replace(/[\uE000-\uF8FF\uFFFD]/g,'')}
const CLP_SUB='₀₁₂₃₄₅₆₇₈₉',CLP_K=s=>s.replace(/\d+/g,'#').trim();
function CLP_join(its){let out='',pv=null;
 for(const it of its){let s=CLP_sym(it.s).replace(/\s+/g,' ');if(!s.trim())continue;const t=s.trim();let sub=false;
  if(pv&&/^\d+$/.test(t)&&it.h<pv.h*0.82&&it.y<=pv.y+0.3)sub=true;
  let sp=true;if(pv){const gap=it.x-(pv.x+(pv.w||0));sp=/\s$/.test(pv.s)||/^\s/.test(s)||(pv.w?gap>0.1*it.h:true);if(sub||/^[∘°]$/.test(t))sp=false;if(pv&&/^[∘°]$/.test(pv.s.trim())&&gap>=0)sp=sp||false;
   if(pv.w&&gap>2.6*it.h&&!sub)out+=' '}
